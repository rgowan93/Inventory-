<style>
:root{
  --gold:#F4B400; --blue:#2160B0; --blue-d:#1a4e8c; --red:#E23B2E;
  --cream:#F3E9D6; --bg:#101117; --bg2:#171922; --bg3:#1f2230;
  --line:#000; --muted:#9aa0b5; --ok:#34c759; --shadow:0 6px 18px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--cream); font-weight:600;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;font-weight:800;cursor:pointer;border:3px solid #000;border-radius:12px;
  padding:11px 14px;background:var(--bg3);color:var(--cream);box-shadow:var(--shadow);font-size:15px}
button:active{transform:translateY(1px)}
button.gold{background:var(--gold);color:#1a1300}
button.blue{background:var(--blue);color:#fff}
button.red{background:var(--red);color:#fff}
button.ghost{background:transparent;box-shadow:none;border-color:#333}
button.sm{padding:7px 10px;font-size:13px;border-radius:9px}
.btn-link{display:inline-block;font-weight:800;text-decoration:none;border:2px solid #333;border-radius:10px;padding:8px 12px;font-size:13px;color:var(--gold);background:transparent}
.csstrip{display:flex;gap:8px;overflow-x:auto;max-width:96vw;margin-top:12px;padding:4px}
.csitem{position:relative;flex:0 0 auto;width:54px;height:76px;border-radius:8px;overflow:hidden;border:2px solid #333;background:#000}
.csitem img{width:100%;height:100%;object-fit:cover}
.csitem .cstag{position:absolute;right:2px;bottom:2px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;padding:0 4px;border-radius:6px}
.srow{display:flex;gap:12px;align-items:flex-start}
.sthumb{width:84px;height:auto;border-radius:8px;border:2px solid var(--gold);background:#000}
.chip{display:inline-block;border:2px solid #333;border-radius:8px;padding:6px 10px;margin:3px 4px 0 0;font-size:12px;font-weight:800;cursor:pointer;background:transparent;color:var(--cream)}
.chip.on{background:var(--gold);color:#1a1300;border-color:#000}
.candpick{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.candpick img{width:46px;height:64px;object-fit:cover;border-radius:6px;border:2px solid #333;cursor:pointer;flex:0 0 auto}
.candpick img.on{border-color:var(--gold)}
/* ===== Public card-show "wall" landing ===== */
.wall{min-height:100%;padding:30px 18px 60px;max-width:760px;margin:0 auto;
  background:radial-gradient(1200px 500px at 50% -120px,rgba(244,180,0,.16),transparent 70%),linear-gradient(180deg,#0d0e14,#15121d 60%,#0d0e14)}
.wall-hero{text-align:center;margin-bottom:26px}
.wall-logo{width:118px;height:118px;object-fit:contain;border-radius:22px;background:#000;border:3px solid var(--gold);
  box-shadow:0 0 0 6px rgba(244,180,0,.12),0 14px 40px rgba(0,0,0,.6);margin-bottom:14px}
.wall-title{font-size:clamp(30px,8vw,44px);font-weight:900;letter-spacing:2px;line-height:1;cursor:pointer;user-select:none;
  text-shadow:0 3px 18px rgba(0,0,0,.6)}
.wall-title b{color:var(--gold)}
.wall-tag{color:var(--cream);opacity:.82;font-weight:700;letter-spacing:1px;margin-top:10px;text-transform:uppercase;font-size:13px}
.wall-cta{margin-top:22px;background:linear-gradient(180deg,#FFCB2D,#F4B400);color:#1a1300;font-weight:900;font-size:19px;
  border:3px solid #000;border-radius:16px;padding:16px 26px;box-shadow:0 10px 26px rgba(244,180,0,.35);width:100%;max-width:420px}
.wall-cta-sub{color:var(--muted);font-size:12px;margin-top:7px}
.wall-share{margin-top:14px;background:transparent;color:var(--gold);border:2px solid var(--gold);font-weight:800;border-radius:14px;padding:11px 22px;font-size:15px}
.wall-sec{font-size:13px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--gold);
  text-align:center;margin:30px 0 14px;position:relative}
.wall-sec:before,.wall-sec:after{content:"";position:absolute;top:50%;width:24%;height:2px;background:linear-gradient(90deg,transparent,#3a3550)}
.wall-sec:before{left:6%}.wall-sec:after{right:6%;background:linear-gradient(270deg,transparent,#3a3550)}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.qrtile{background:linear-gradient(180deg,#1c1e2b,#15161f);border:2px solid #2c2f42;border-radius:18px;padding:14px 12px 12px;
  text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.qrlabel{font-weight:900;font-size:15px;color:var(--cream);margin-bottom:10px;letter-spacing:.5px}
.qrtile .qr{width:100%;max-width:190px;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:12px;padding:8px;border:2px solid #000}
.qrtile .qr.qrphoto{object-fit:cover;padding:0}
.qrtile.tap{cursor:pointer}
.qrtile.tap:active{transform:translateY(1px)}
.qrtap{margin-top:9px;color:var(--gold);font-weight:800;font-size:12px}
.qrsub{margin-top:9px;color:var(--muted);font-size:12px;font-weight:700;word-break:break-word}
.qrmiss{display:flex;align-items:center;justify-content:center;width:100%;max-width:190px;aspect-ratio:1/1;margin:0 auto;
  background:#0b0c11;border:2px dashed #3a3550;border-radius:12px;color:#5a5f78;font-size:12px}
.wall-foot{text-align:center;color:var(--muted);margin-top:26px;font-weight:700}
.showlist{display:grid;gap:12px}
.showcard{background:linear-gradient(180deg,#1c1e2b,#15161f);border:2px solid #2c2f42;border-radius:14px;padding:12px 14px;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.showname{font-weight:900;color:var(--cream);font-size:16px}
.showwhen{color:var(--gold);font-weight:800;margin-top:3px}
.showaddr{display:inline-block;margin-top:5px;color:var(--cream);text-decoration:none;font-weight:700;font-size:13px}
.staff-signin{background:transparent;border:none;box-shadow:none;color:#5a5f78;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;padding:6px 10px}
.walltabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:2px 2px 14px;margin-bottom:4px}
.walltab{flex:0 0 auto;background:#1c1e2b;border:2px solid #2c2f42;color:var(--cream);font-weight:800;font-size:13px;letter-spacing:.5px;border-radius:999px;padding:9px 15px;cursor:pointer;white-space:nowrap}
.walltab.on{background:var(--gold);color:#1a1300;border-color:#000}
.tabbadge{display:inline-block;background:var(--red);color:#fff;font-size:10px;font-weight:900;border-radius:999px;padding:1px 6px;margin-left:2px;vertical-align:middle}
.mktbar{display:flex;gap:8px;margin-bottom:8px}
.mktsearch{flex:1;min-width:0}
.mktsort{flex:0 0 auto;width:auto}
.mktsubs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mktsub{flex:0 0 auto;background:#1c1e2b;border:2px solid #2c2f42;color:var(--cream);font-weight:800;font-size:12px;border-radius:999px;padding:6px 14px;cursor:pointer}
.mktsub.on{background:var(--gold);color:#1a1300;border-color:#000}
.lnkitems{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.lnkitem{background:#11131c;border:1px solid #2c2f42;border-radius:8px;color:var(--gold);font-weight:700;font-size:13px;padding:4px 9px;cursor:pointer}
.showflyer{width:100%;max-height:420px;object-fit:contain;background:#000;border-radius:12px;border:2px solid #2c2f42;margin-bottom:10px;cursor:pointer;display:block}
.memcount{color:var(--muted);font-weight:800;text-align:center;margin-bottom:10px}
.memrow{display:flex;align-items:center;gap:10px;background:#11131c;border:1px solid #2c2f42;border-radius:10px;padding:9px 12px;margin-bottom:8px}
.memmain{flex:1;min-width:0}
.memname{font-weight:800;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mememail{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.membadge{display:inline-block;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;padding:1px 6px;border-radius:6px;background:#2a2e40;color:var(--muted);vertical-align:middle;margin-left:4px}
.membadge.acct{background:var(--gold);color:#1a1300}
.memphone{font-weight:800;color:var(--gold);text-decoration:none;white-space:nowrap}
.memdate{color:var(--muted);font-size:11px;white-space:nowrap}
.memdel{background:transparent;border:none;box-shadow:none;color:var(--red);font-weight:900;font-size:16px;padding:0 4px;cursor:pointer}
.custbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.custhi{font-weight:800;color:var(--cream);font-size:13px;margin-right:auto}
.custbtn{background:#1c1e2b;border:2px solid #2c2f42;color:var(--cream);font-weight:800;font-size:12px;border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.custbtn.gold{background:var(--gold);color:#1a1300;border-color:#000}
.mktgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.mktcard{position:relative;background:linear-gradient(180deg,#1c1e2b,#15161f);border:2px solid #2c2f42;border-radius:14px;padding:10px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.mktcard:active{transform:translateY(1px)}
.mktimg{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:#000;display:block}
.mktnoimg{display:flex;align-items:center;justify-content:center;color:#5a5f78;font-size:12px;border:2px dashed #3a3550}
.mkttitle{font-weight:800;color:var(--cream);margin-top:8px;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mktprice{font-weight:900;color:var(--gold);margin-top:4px;font-size:17px}
.mktcond{color:var(--muted);font-size:12px;margin-top:2px}
.mkttags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mkttag{font-size:10px;font-weight:800;background:#2a2e40;color:var(--cream);padding:2px 7px;border-radius:6px}
.mktflag{position:absolute;top:8px;left:8px;z-index:2;font-size:11px;font-weight:900;letter-spacing:1px;padding:3px 8px;border-radius:7px;color:#fff}
.mktflag.sold{background:var(--red)}.mktflag.hid{background:#555}
.mktflag.promo{background:linear-gradient(180deg,#FFCB2D,#F4B400);color:#1a1300}
.mktflag.verif{background:#2160B0}
.mktcond.promoted{color:var(--gold);font-weight:800}
.vbadge{display:inline-block;background:#2160B0;color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:0 5px;margin-left:2px}
.sellerlink{color:var(--gold);font-weight:800;text-decoration:underline;cursor:pointer}
.pagewrap{align-items:stretch!important;justify-content:center;padding:0!important}
.pagecard{max-width:560px;width:100%;min-height:100dvh;border-radius:0!important;overflow:auto;padding-top:calc(env(safe-area-inset-top) + 12px)!important}
.pagehead{position:sticky;top:0;background:linear-gradient(180deg,#1c1e2b,#15161f);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;margin:0 0 10px;z-index:6;border-bottom:1px solid #2c2f42}
.pageclose{background:var(--red);color:#fff;border:none;box-shadow:none;border-radius:10px;padding:9px 16px;font-weight:900;font-size:14px}
.qtystep{display:flex;align-items:center;gap:6px;margin-right:6px}
.qtystep button{padding:2px 9px;font-size:16px;border-radius:8px;border-width:2px}
.qtystep span{min-width:18px;text-align:center;font-weight:800}
.notifrow{background:#15161f;border:1px solid #2c2f42;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.notifrow.unread{border-color:var(--gold);background:#1c1e2b}
.notiftitle{font-weight:800;color:var(--cream);font-size:14px}
.notifbody{color:var(--muted);font-size:13px;margin-top:2px}
.notiftime{color:#5a5f78;font-size:11px;margin-top:4px}
.installbanner{position:relative;background:linear-gradient(180deg,#1f2230,#15161f);border:2px solid var(--gold);border-radius:14px;padding:12px 36px 12px 14px;margin:0 0 14px;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.installbanner .ibtitle{font-weight:900;color:var(--gold);font-size:15px}
.installbanner .ibmsg{color:var(--cream);font-size:13px;margin-top:3px}
.installbanner .ibx{position:absolute;top:6px;right:6px;background:transparent;border:none;box-shadow:none;color:var(--muted);font-size:16px;padding:4px 8px}
.mktdetgal{display:flex;gap:8px;overflow-x:auto}
.mktdetimg{width:88%;flex:0 0 auto;aspect-ratio:1/1;object-fit:contain;background:#000;border-radius:12px;border:2px solid #2c2f42}
.chkrow{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:700;color:var(--cream);font-size:14px}
.chkrow input{width:18px;height:18px}
.lpthumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.lpthumb{position:relative;display:inline-block}
.lpthumb img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:2px solid #2c2f42;background:#000}
.lpdel{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:900;cursor:pointer;padding:0;box-shadow:none}
.cartsub{text-align:right;font-size:16px;color:var(--cream);margin-top:8px}.cartsub b{color:var(--gold)}
.ckitems{margin:8px 0;border-top:1px solid #2c2f42}
.ckrow{display:flex;justify-content:space-between;gap:10px;padding:4px 0;color:var(--cream);font-size:14px}
.cktot{margin-top:8px;border-top:1px solid #2c2f42;padding-top:6px}
.cktotal{font-weight:900;color:var(--gold);font-size:17px;border-top:1px dashed #3a3550;margin-top:4px;padding-top:6px}
.sqcard{background:#fff;border-radius:10px;padding:6px 10px;min-height:48px}
.ckerr{color:var(--red);font-weight:700;font-size:13px;min-height:16px;margin-top:6px}
.ordcard{background:linear-gradient(180deg,#1c1e2b,#15161f);border:2px solid #2c2f42;border-radius:12px;padding:12px;margin-bottom:10px}
.ordhead{display:flex;justify-content:space-between;align-items:center}
.ordstatus{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:7px;background:#2a2e40;color:var(--cream)}
.ordstatus.s_paid{background:#2160B0;color:#fff}
.ordstatus.s_ready,.ordstatus.s_shipped{background:#b8860b;color:#1a1300}
.ordstatus.s_complete{background:var(--ok);color:#08210f}
.ordstatus.s_canceled{background:#555;color:#fff}
.ordstatus.s_refunded{background:#7a4dbb;color:#fff}
.ordstatus.s_open,.ordstatus.s_escalated,.ordstatus.s_seller_responded{background:#b8860b;color:#1a1300}
.ordstatus.s_resolved{background:var(--ok);color:#08210f}
.msglist{flex:1;overflow:auto;min-height:160px;max-height:48vh;display:flex;flex-direction:column;gap:8px;padding:8px;background:#0e0f17;border:1px solid #2c2f42;border-radius:10px}
.msgb{max-width:82%;padding:7px 10px;border-radius:12px;font-size:14px}
.msgb.me{align-self:flex-end;background:#2160B0;color:#fff;border-bottom-right-radius:3px}
.msgb.them{align-self:flex-start;background:#1c1e2b;border:1px solid #2c2f42;color:var(--cream);border-bottom-left-radius:3px}
.msgmeta{font-size:10px;opacity:.7;margin-bottom:2px}
.msgtxt{white-space:pre-wrap;word-break:break-word}
.wall-stats{margin-top:16px;color:var(--cream);font-weight:700;font-size:14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.wall-stats b{color:var(--gold);font-size:17px}.wall-stats .dot{color:#3a3550}
.revcard{text-align:center}
.revavg{font-size:20px;font-weight:900;color:var(--gold);margin-bottom:10px}
.revlist{margin-top:14px;text-align:left;display:grid;gap:10px}
.rev{background:#11131c;border:1px solid #2c2f42;border-radius:12px;padding:10px 12px}
.revstars{color:var(--gold);letter-spacing:2px}
.revtext{color:var(--cream);margin:4px 0;font-weight:600}
.revby{color:var(--muted);font-size:12px}
.rvstars{font-size:34px;letter-spacing:6px;text-align:center;margin:6px 0 4px;cursor:pointer;color:#3a3550}
.rvstars span{color:#3a3550;transition:color .1s}.rvstars span.on{color:var(--gold)}
.mediagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mcard{background:linear-gradient(180deg,#1c1e2b,#15161f);border:2px solid #2c2f42;border-radius:16px;padding:10px;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.mmedia{width:100%;border-radius:12px;background:#000;max-height:360px;object-fit:cover;display:block}
.mcap{color:var(--cream);font-weight:700;margin:8px 2px 2px}
.mmeta{color:var(--muted);font-size:11px;margin:2px}
.mcomments{margin-top:8px;display:grid;gap:5px}
.cmt{background:#11131c;border:1px solid #2c2f42;border-radius:9px;padding:6px 9px;font-size:13px;color:var(--cream)}
.cmt b{color:var(--gold)}
.cmtdel{background:transparent;border:none;box-shadow:none;color:var(--red);font-weight:900;font-size:13px;padding:0 4px;cursor:pointer;float:right}
input,select,textarea{font-family:inherit;font-weight:700;background:#0b0c11;color:var(--cream);
  border:2px solid #2a2e40;border-radius:10px;padding:10px 11px;font-size:15px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
label.fld{display:block;margin:9px 0}
label.fld span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
a{color:var(--gold)}
.app{max-width:1100px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;transition:margin-left .22s ease}
header.top{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg2);
  border-bottom:4px solid #000;position:sticky;top:0;z-index:30}
header.top img{height:46px;width:46px;object-fit:contain;border-radius:10px;background:#000;border:2px solid var(--gold)}
header.top .ttl{font-size:20px;font-weight:900;letter-spacing:.5px}
header.top .ttl b{color:var(--gold)}
header.top .who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
header.top .who select{width:auto}
/* left menu — slides in and stays locked open until the collapse arrow is tapped */
nav.tabs{position:fixed;top:0;left:0;height:100%;width:250px;display:flex;flex-direction:column;gap:8px;
  padding:12px 12px 24px;background:var(--bg2);border-right:4px solid #000;box-shadow:var(--shadow);
  transform:translateX(-100%);transition:transform .22s ease;z-index:40;overflow-y:auto}
nav.tabs.open{transform:translateX(0)}
nav.tabs button{width:100%;text-align:left;white-space:nowrap;background:transparent;box-shadow:none;
  border-color:#2c3043;font-size:15px;padding:12px 14px}
nav.tabs button.active{background:var(--gold);color:#1a1300;border-color:#000}
.menu-collapse{align-self:stretch;color:var(--muted)!important;font-size:13px!important;padding:9px 12px!important;margin-bottom:4px}
.menu-brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px;padding:2px 4px 8px;border-bottom:2px solid #2a2e40;margin-bottom:6px}
.menu-brand b{color:var(--gold)}
/* on wider screens the locked menu pushes content over instead of covering it */
@media(min-width:760px){ body.menu-open .app{margin-left:250px} }
.menu-btn{background:transparent;box-shadow:none;border-color:#2c3043;font-size:20px;padding:5px 12px;line-height:1}
.avatar-sm{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#000}
.avatar-lg{width:68px;height:68px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);background:#000}
.avatar-ph{display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--gold)}
.avatar-lg.avatar-ph{font-size:24px}.avatar-sm.avatar-ph{font-size:13px}
.badge{display:inline-block;min-width:18px;text-align:center;background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:900;padding:1px 6px;margin-left:6px}
/* Collectr-style bottom navigation for the main destinations */
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:38;display:flex;background:var(--bg2);border-top:3px solid #000;
  padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.4)}
.botnav button{flex:1;background:transparent;box-shadow:none;border:none;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 2px}
.botnav button.on{color:var(--gold)}
.botnav .ic{font-size:21px;line-height:1;position:relative}
.botnav .nbadge{position:absolute;top:-5px;right:-10px;min-width:15px;height:15px;background:var(--red);color:#fff;border-radius:999px;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 3px}
main{padding:16px 14px 110px;flex:1}
h2.page{margin:2px 0 14px;font-size:24px;font-weight:900}
h2.page small{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:3px}
.card{background:var(--bg2);border:3px solid #000;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:16px;color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;border:2px solid #000}
.pill.nm{background:#1f7a3d;color:#fff}.pill.lp{background:#3a6ea5;color:#fff}
.pill.mp{background:#a5862f;color:#1a1300}.pill.hp{background:#a5532f;color:#fff}.pill.dmg{background:#8a2f2f;color:#fff}
.pill.owner{background:var(--blue);color:#fff}
.pill.avail{background:#1f7a3d;color:#fff}.pill.intake{background:#7a5a1f;color:#fff}
.pill.sold{background:#8a2f2f;color:#fff}.pill.hold{background:#555;color:#fff}.pill.cart{background:var(--gold);color:#1a1300}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #2a2e40}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
tr:hover td{background:#1c1f2b}
.invitem{display:flex;gap:12px;align-items:center}
.invitem .ph{width:54px;height:74px;border-radius:8px;object-fit:cover;background:#0b0c11;border:2px solid #2a2e40;display:flex;align-items:center;justify-content:center;color:#3b3f55;font-size:10px;text-align:center}
.money{font-variant-numeric:tabular-nums;font-weight:900}
.big{font-size:30px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:760px){.kpi{grid-template-columns:1fr 1fr}}
.kpi .card{margin:0;text-align:center}
.muted{color:var(--muted);font-size:13px}
.right{margin-left:auto}
.cart-line{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #2a2e40}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;border:3px solid var(--gold);
  color:var(--cream);padding:12px 18px;border-radius:12px;z-index:100000;box-shadow:var(--shadow);font-weight:800;max-width:90%}
.modalx{position:absolute;top:6px;right:8px;background:transparent;border:none;box-shadow:none;color:var(--red);font-size:24px;font-weight:900;line-height:1;cursor:pointer;padding:4px 9px;z-index:3}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.scanbar{display:flex;gap:8px;align-items:center}
.scanbar input{font-size:18px;font-weight:900;letter-spacing:1px}
.barcode-label{background:#fff;color:#000;border:1px solid #000;border-radius:5px;padding:5px 5px 3px;width:150px;text-align:center;display:inline-block;margin:3px;page-break-inside:avoid;vertical-align:top}
.barcode-label .nm{font-size:9px;font-weight:800;line-height:1.12;margin-bottom:2px;font-family:Arial;height:34px;overflow:hidden}
.barcode-label .id{font-size:9px;letter-spacing:1px;font-family:monospace}
.banner{background:var(--blue-d);border:2px solid #000;border-radius:10px;padding:10px 12px;color:var(--cream);font-size:13px}
.scanmodal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.scanmodal video{width:min(92vw,520px);border:3px solid var(--gold);border-radius:14px;background:#000}
.scanmodal .hint{color:var(--cream);margin:12px;font-weight:800;text-align:center;max-width:520px}
.pickrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #2a2e40}
hr.sep{border:none;border-top:1px solid #2a2e40;margin:12px 0}
.tag{font-size:11px;background:#2a2e40;color:var(--cream);padding:2px 7px;border-radius:6px;font-weight:800}
header.top .who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
header.top .who select{width:auto}
.imgchip{position:fixed;right:14px;bottom:82px;z-index:120;background:#000;border:3px solid var(--blue);color:var(--cream);
  padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);font-weight:800;font-size:13px;display:flex;gap:10px;align-items:center;max-width:90vw}
.imgchip button{padding:5px 9px;font-size:12px;border-radius:8px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{background:transparent;box-shadow:none;border-color:#2c3043;font-size:13px;padding:7px 12px}
.subtabs button.on{background:var(--blue);color:#fff;border-color:#000}
.login{max-width:380px;margin:6vh auto}
.login .card{padding:18px}
.candrow{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.candrow .cand{flex:0 0 auto;text-align:center;cursor:pointer;border:3px solid #2a2e40;border-radius:10px;padding:4px;background:#0b0c11}
.candrow .cand img{width:90px;height:124px;object-fit:cover;border-radius:6px;display:block}
.candrow .cand.sel{border-color:var(--gold)}
.blurwrap{position:relative;display:inline-block;touch-action:none}
.blurwrap canvas{max-width:90vw;border:3px solid var(--gold);border-radius:10px;background:#000}
.blurbox{position:absolute;border:2px dashed var(--gold);background:rgba(244,180,0,.12);cursor:move}
.reviewbadge{background:var(--gold);color:#1a1300;font-size:10px;font-weight:900;padding:2px 6px;border-radius:6px}
.landing{display:flex;flex-direction:column;min-height:calc(100vh - 80px)}
.landing-top{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:4px 2px 12px}
.landing-top button{font-size:16px;padding:12px 22px}
.bounce-area{position:relative;flex:1;min-height:44vh;border:3px solid #000;border-radius:18px;overflow:hidden;
  background:radial-gradient(circle at 50% 40%,#22305a 0%,var(--bg2) 60%,var(--bg) 100%)}
.bounce-logo{position:absolute;top:0;left:0;width:min(46vw,300px);height:auto;border-radius:18px;
  box-shadow:0 6px 24px rgba(0,0,0,.45);will-change:transform;user-select:none;pointer-events:none}
.landing-cap{text-align:center;font-size:28px;font-weight:900;letter-spacing:1px;margin:14px 0 2px}
.landing-cap b{color:var(--gold)}
.landing-tag{text-align:center;color:var(--muted);max-width:640px;margin:0 auto 8px;font-size:15px}
.landing-info{max-width:920px;margin:18px auto 32px;padding:0 4px}
.landing-h{text-align:center;font-size:20px;font-weight:800;margin:18px 0}
.features{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:620px){.features{grid-template-columns:1fr}}
.feat{display:flex;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px}
.feat-ic{font-size:24px;line-height:1}
.feat-t{font-weight:800;margin-bottom:3px}
.feat-d{color:var(--muted);font-size:13px;line-height:1.45}
.landing-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
button.lg{font-size:16px;padding:14px 26px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.plans{grid-template-columns:1fr}}
.plan{text-align:left;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;color:inherit}
.plan.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(244,180,0,.25)}
.plan-name{font-weight:800;font-size:15px}
.plan-price{font-size:26px;font-weight:900;margin:4px 0}
.plan-price span{font-size:13px;font-weight:600;color:var(--muted)}
.plan-tbd{font-size:15px;font-weight:700;color:var(--muted)}
.plan-blurb{color:var(--muted);font-size:12px;line-height:1.4}
@media print{
  header.top,nav.tabs,.botnav,.noprint,.imgchip{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0}
  .card{box-shadow:none;border:1px solid #999;background:#fff;color:#000}
  .barcode-label{border:1px dashed #000}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button id="menuBtn" class="menu-btn" onclick="toggleMenu()" title="Menu" style="display:none">☰</button>
    <img id="brandLogo" alt="logo" />
    <div class="ttl"><b>HOUSE</b> OF CARDS</div>
    <div class="who" id="whoBar"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>
<nav class="botnav" id="botnav" style="display:none"></nav>
<div id="toast"></div>
<div id="imgchip" class="imgchip" style="display:none"></div>
<script>
/* on-screen crash catcher — surfaces JS errors instead of a blank/crashing page */
(function(){function box(){var d=document.getElementById('crashlog');if(!d){d=document.createElement('div');d.id='crashlog';d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#3a0d0d;color:#fff;font:12px/1.4 monospace;padding:10px;white-space:pre-wrap;max-height:55vh;overflow:auto;border-top:2px solid #f44';document.body&&document.body.appendChild(d);}return d;}
window.addEventListener('error',function(e){var msg=(e.message||e.error||'')+'';
  /* ignore browser-masked cross-origin "Script error." (e.g. from CDN scripts) — it's noise, not a real app crash */
  if(/^script error\.?$/i.test(msg.trim())) return;
  var d=box();if(d)d.textContent+='ERR: '+msg+'  ['+(e.filename||'').split('/').pop()+':'+(e.lineno||'')+']\n';});
window.addEventListener('unhandledrejection',function(e){var d=box();if(d)d.textContent+='ASYNC: '+((e.reason&&(e.reason.message||e.reason))||'')+'\n';});})();
</script>

   localStorage, so staff/customers stay logged in inside the installed app. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
