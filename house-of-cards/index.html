<html lang="en">
<head>

<link rel="manifest" href="manifest.json" />

<meta name="mobile-web-app-capable" content="yes" />

<meta name="twitter:description" content="Cards, singles, slabs &amp; deals." />

<style>
:root{
  --gold:#F4B400; --blue:#2160B0; --blue-d:#1a4e8c; --red:#E23B2E;
  --cream:#F3E9D6; --bg:#101117; --bg2:#171922; --bg3:#1f2230;
  --line:#000; --muted:#9aa0b5; --ok:#34c759; --shadow:0 6px 18px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior-y:none}
.ptr{position:fixed;top:0;left:50%;transform:translate(-50%,-46px);z-index:99999;background:var(--gold);color:#1a1300;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.45);opacity:0;transition:opacity .15s,transform .15s}
.ptr.ready{background:#fff}
.ptr.spin .ptrspin{display:inline-block;animation:ptrspin .6s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
body{
  background:var(--bg); color:var(--cream); font-weight:600;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;font-weight:800;cursor:pointer;border:3px solid #000;border-radius:12px;
  padding:11px 14px;background:var(--bg3);color:var(--cream);box-shadow:var(--shadow);font-size:15px}
button:active{transform:translateY(1px)}
button.gold{background:var(--gold);color:#1a1300}
button.blue{background:var(--blue);color:#fff}
button.red{background:var(--red);color:#fff}
button.ghost{background:transparent;box-shadow:none;border-color:#333}
button.sm{padding:7px 10px;font-size:13px;border-radius:9px}
.btn-link{display:inline-block;font-weight:800;text-decoration:none;border:2px solid #333;border-radius:10px;padding:8px 12px;font-size:13px;color:var(--gold);background:transparent}
.csstrip{display:flex;gap:8px;overflow-x:auto;max-width:96vw;margin-top:12px;padding:4px}
.csitem{position:relative;flex:0 0 auto;width:54px;height:76px;border-radius:8px;overflow:hidden;border:2px solid #333;background:#000}
.csitem img{width:100%;height:100%;object-fit:cover}
.csitem .cstag{position:absolute;right:2px;bottom:2px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;padding:0 4px;border-radius:6px}
.srow{display:flex;gap:12px;align-items:flex-start}
.sthumb{width:84px;height:auto;border-radius:8px;border:2px solid var(--gold);background:#000}
.chip{display:inline-block;border:2px solid #333;border-radius:8px;padding:6px 10px;margin:3px 4px 0 0;font-size:12px;font-weight:800;cursor:pointer;background:transparent;color:var(--cream)}
.chip.on{background:var(--gold);color:#1a1300;border-color:#000}
.candpick{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.candpick img{width:46px;height:64px;object-fit:cover;border-radius:6px;border:2px solid #333;cursor:pointer;flex:0 0 auto}
.candpick img.on{border-color:var(--gold)}
/* ===== Public card-show "wall" landing ===== */
.wall{min-height:100%;padding:30px 18px 60px;max-width:760px;margin:0 auto;
  background:radial-gradient(1200px 500px at 50% -120px,rgba(244,180,0,.16),transparent 70%),linear-gradient(180deg,#0d0e14,#15121d 60%,#0d0e14)}
.wall-hero{text-align:center;margin-bottom:26px}
.wall-logo{width:118px;height:118px;object-fit:contain;border-radius:22px;background:#fff;padding:6px;border:3px solid var(--gold);
  box-shadow:0 0 0 6px rgba(244,180,0,.12),0 14px 40px rgba(0,0,0,.6);margin-bottom:14px}
.wall-title{font-size:clamp(30px,8vw,44px);font-weight:900;letter-spacing:2px;line-height:1;cursor:pointer;user-select:none;
  text-shadow:0 3px 18px rgba(0,0,0,.6)}
.wall-title b{color:var(--gold)}
.wall-tag{color:var(--cream);opacity:.82;font-weight:700;letter-spacing:1px;margin-top:10px;text-transform:uppercase;font-size:13px}
.wall-cta{margin-top:22px;background:linear-gradient(180deg,#FFCB2D,#F4B400);color:#1a1300;font-weight:900;font-size:19px;
  border:3px solid #000;border-radius:16px;padding:16px 26px;box-shadow:0 10px 26px rgba(244,180,0,.35);width:100%;max-width:420px}
.wall-cta-sub{color:var(--muted);font-size:12px;margin-top:7px}
.wall-share{margin-top:14px;background:transparent;color:var(--gold);border:2px solid var(--gold);font-weight:800;border-radius:14px;padding:11px 22px;font-size:15px}
.wall-sec{font-size:13px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--gold);
  text-align:center;margin:30px 0 14px;position:relative}
.wall-sec:before,.wall-sec:after{content:"";position:absolute;top:50%;width:24%;height:2px;background:linear-gradient(90deg,transparent,#3a3550)}
.wall-sec:before{left:6%}.wall-sec:after{right:6%;background:linear-gradient(270deg,transparent,#3a3550)}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.qrtile{background:linear-gradient(180deg,#1c1e2b,#15161f);border:2px solid #2c2f42;border-radius:18px;padding:14px 12px 12px;
  text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.qrlabel{font-weight:900;font-size:15px;color:var(--cream);margin-bottom:10px;letter-spacing:.5px}
.qrtile .qr{width:100%;max-width:190px;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:12px;padding:8px;border:2px solid #000}
.qrtile .qr.qrphoto{object-fit:cover;padding:0}
.qrtile.tap{cursor:pointer}
.qrtile.tap:active{transform:translateY(1px)}
.qrtap{margin-top:9px;color:var(--gold);font-weight:800;font-size:12px}
.qrsub{margin-top:9px;color:var(--muted);font-size:12px;font-weight:700;word-break:break-word}
.qrmiss{display:flex;align-items:center;justify-content:center;width:100%;max-width:190px;aspect-ratio:1/1;margin:0 auto;
  background:#0b0c11;border:2px dashed #3a3550;border-radius:12px;color:#5a5f78;font-size:12px}
.wall-foot{text-align:center;color:var(--muted);margin-top:26px;font-weight:700}
.showlist{display:grid;gap:12px}
.showcard{background:linear-gradient(180deg,#1c1e2b,#15161f);border:2px solid #2c2f42;border-radius:14px;padding:12px 14px;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.showname{font-weight:900;color:var(--cream);font-size:16px}
.showwhen{color:var(--gold);font-weight:800;margin-top:3px}
.showaddr{display:inline-block;margin-top:5px;color:var(--cream);text-decoration:none;font-weight:700;font-size:13px}
.staff-signin{background:transparent;border:none;box-shadow:none;color:#5a5f78;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;padding:6px 10px}
.walltabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:2px 2px 14px;margin-bottom:4px}
.walltab{flex:0 0 auto;background:#1c1e2b;border:2px solid #2c2f42;color:var(--cream);font-weight:800;font-size:13px;letter-spacing:.5px;border-radius:999px;padding:9px 15px;cursor:pointer;white-space:nowrap}
.walltab.on{background:var(--gold);color:#1a1300;border-color:#000}
.tabbadge{display:inline-block;background:var(--red);color:#fff;font-size:10px;font-weight:900;border-radius:999px;padding:1px 6px;margin-left:2px;vertical-align:middle}
.mktbar{display:flex;gap:8px;margin-bottom:8px}
.mktsearch{flex:1;min-width:0}
.mktsort{flex:0 0 auto;width:auto}
.mktsubs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mktsub{flex:0 0 auto;background:#1c1e2b;border:2px solid #2c2f42;color:var(--cream);font-weight:800;font-size:12px;border-radius:999px;padding:6px 14px;cursor:pointer}
.mktsub.on{background:var(--gold);color:#1a1300;border-color:#000}
.lnkitems{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.lnkitem{background:#11131c;border:1px solid #2c2f42;border-radius:8px;color:var(--gold);font-weight:700;font-size:13px;padding:4px 9px;cursor:pointer}
.showflyer{width:100%;max-height:420px;object-fit:contain;background:#000;border-radius:12px;border:2px solid #2c2f42;margin-bottom:10px;cursor:pointer;display:block}
.memcount{color:var(--muted);font-weight:800;text-align:center;margin-bottom:10px}
.memrow{display:flex;align-items:center;gap:10px;background:#11131c;border:1px solid #2c2f42;border-radius:10px;padding:9px 12px;margin-bottom:8px}
.memmain{flex:1;min-width:0}
.memname{font-weight:800;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mememail{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.membadge{display:inline-block;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;padding:1px 6px;border-radius:6px;background:#2a2e40;color:var(--muted);vertical-align:middle;margin-left:4px}
.membadge.acct{background:var(--gold);color:#1a1300}
.memphone{font-weight:800;color:var(--gold);text-decoration:none;white-space:nowrap}
.memdate{color:var(--muted);font-size:11px;white-space:nowrap}
.memdel{background:transparent;border:none;box-shadow:none;color:var(--red);font-weight:900;font-size:16px;padding:0 4px;cursor:pointer}
.custbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.custhi{font-weight:800;color:var(--cream);font-size:13px;margin-right:auto}
.custbtn{background:#1c1e2b;border:2px solid #2c2f42;color:var(--cream);font-weight:800;font-size:12px;border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.custbtn.gold{background:var(--gold);color:#1a1300;border-color:#000}
.mktgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.mktcard{position:relative;background:linear-gradient(180deg,#1c1e2b,#15161f);border:2px solid #2c2f42;border-radius:14px;padding:10px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.mktcard:active{transform:translateY(1px)}
.mktimg{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:#000;display:block}
.mktnoimg{display:flex;align-items:center;justify-content:center;color:#5a5f78;font-size:12px;border:2px dashed #3a3550}
.mkttitle{font-weight:800;color:var(--cream);margin-top:8px;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mktprice{font-weight:900;color:var(--gold);margin-top:4px;font-size:17px}
.mktcond{color:var(--muted);font-size:12px;margin-top:2px}
.mkttags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mkttag{font-size:10px;font-weight:800;background:#2a2e40;color:var(--cream);padding:2px 7px;border-radius:6px}
.mktflag{position:absolute;top:8px;left:8px;z-index:2;font-size:11px;font-weight:900;letter-spacing:1px;padding:3px 8px;border-radius:7px;color:#fff}
.mktflag.sold{background:var(--red)}.mktflag.hid{background:#555}
.mktflag.promo{background:linear-gradient(180deg,#FFCB2D,#F4B400);color:#1a1300}
.mktflag.verif{background:#2160B0}
.mktcond.promoted{color:var(--gold);font-weight:800}
.vbadge{display:inline-block;background:#2160B0;color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:0 5px;margin-left:2px}
.sellerlink{color:var(--gold);font-weight:800;text-decoration:underline;cursor:pointer}
.pagewrap{align-items:stretch!important;justify-content:center;padding:0!important}
.pagecard{max-width:560px;width:100%;min-height:100dvh;border-radius:0!important;overflow:auto;overscroll-behavior:contain;padding-top:calc(env(safe-area-inset-top) + 12px)!important}
.pagehead{position:sticky;top:0;background:linear-gradient(180deg,#1c1e2b,#15161f);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;margin:0 0 10px;z-index:6;border-bottom:1px solid #2c2f42}
.pageclose{background:var(--red);color:#fff;border:none;box-shadow:none;border-radius:10px;padding:9px 16px;font-weight:900;font-size:14px}
.qtystep{display:flex;align-items:center;gap:6px;margin-right:6px}
.qtystep button{padding:2px 9px;font-size:16px;border-radius:8px;border-width:2px}
.qtystep span{min-width:18px;text-align:center;font-weight:800}
.notifrow{background:#15161f;border:1px solid #2c2f42;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.notifrow.unread{border-color:var(--gold);background:#1c1e2b}
.notiftitle{font-weight:800;color:var(--cream);font-size:14px}
.notifbody{color:var(--muted);font-size:13px;margin-top:2px}
.notiftime{color:#5a5f78;font-size:11px;margin-top:4px}
.installbanner{position:relative;background:linear-gradient(180deg,#1f2230,#15161f);border:2px solid var(--gold);border-radius:14px;padding:12px 36px 12px 14px;margin:0 0 14px;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.installbanner .ibtitle{font-weight:900;color:var(--gold);font-size:15px}
.installbanner .ibmsg{color:var(--cream);font-size:13px;margin-top:3px}
.installbanner .ibx{position:absolute;top:6px;right:6px;background:transparent;border:none;box-shadow:none;color:var(--muted);font-size:16px;padding:4px 8px}
.mktdetgal{display:flex;gap:8px;overflow-x:auto}
.mktdetimg{width:88%;flex:0 0 auto;aspect-ratio:1/1;object-fit:contain;background:#000;border-radius:12px;border:2px solid #2c2f42}
.chkrow{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:700;color:var(--cream);font-size:14px}
.chkrow input{width:18px;height:18px}
.lpthumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.lpthumb{position:relative;display:inline-block}
.lpthumb img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:2px solid #2c2f42;background:#000}
.lpdel{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:900;cursor:pointer;padding:0;box-shadow:none}
.cartsub{text-align:right;font-size:16px;color:var(--cream);margin-top:8px}.cartsub b{color:var(--gold)}
.ckitems{margin:8px 0;border-top:1px solid #2c2f42}
.ckrow{display:flex;justify-content:space-between;gap:10px;padding:4px 0;color:var(--cream);font-size:14px}
.cktot{margin-top:8px;border-top:1px solid #2c2f42;padding-top:6px}
.cktotal{font-weight:900;color:var(--gold);font-size:17px;border-top:1px dashed #3a3550;margin-top:4px;padding-top:6px}
.sqcard{background:#fff;border-radius:10px;padding:6px 10px;min-height:48px}
.ckerr{color:var(--red);font-weight:700;font-size:13px;min-height:16px;margin-top:6px}
.ordcard{background:linear-gradient(180deg,#1c1e2b,#15161f);border:2px solid #2c2f42;border-radius:12px;padding:12px;margin-bottom:10px}
.ordhead{display:flex;justify-content:space-between;align-items:center}
.ordstatus{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:7px;background:#2a2e40;color:var(--cream)}
.ordstatus.s_paid{background:#2160B0;color:#fff}
.ordstatus.s_ready,.ordstatus.s_shipped{background:#b8860b;color:#1a1300}
.ordstatus.s_complete{background:var(--ok);color:#08210f}
.ordstatus.s_canceled{background:#555;color:#fff}
.ordstatus.s_refunded{background:#7a4dbb;color:#fff}
.ordstatus.s_open,.ordstatus.s_escalated,.ordstatus.s_seller_responded{background:#b8860b;color:#1a1300}
.ordstatus.s_resolved{background:var(--ok);color:#08210f}
.msglist{flex:1;overflow:auto;min-height:160px;max-height:48vh;display:flex;flex-direction:column;gap:8px;padding:8px;background:#0e0f17;border:1px solid #2c2f42;border-radius:10px}
.msgb{max-width:82%;padding:7px 10px;border-radius:12px;font-size:14px}
.msgb.me{align-self:flex-end;background:#2160B0;color:#fff;border-bottom-right-radius:3px}
.msgb.them{align-self:flex-start;background:#1c1e2b;border:1px solid #2c2f42;color:var(--cream);border-bottom-left-radius:3px}
.msgmeta{font-size:10px;opacity:.7;margin-bottom:2px}
.msgtxt{white-space:pre-wrap;word-break:break-word}
.wall-stats{margin-top:16px;color:var(--cream);font-weight:700;font-size:14px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.wall-stats b{color:var(--gold);font-size:17px}.wall-stats .dot{color:#3a3550}
.revcard{text-align:center}
.revavg{font-size:20px;font-weight:900;color:var(--gold);margin-bottom:10px}
.revlist{margin-top:14px;text-align:left;display:grid;gap:10px}
.rev{background:#11131c;border:1px solid #2c2f42;border-radius:12px;padding:10px 12px}
.revstars{color:var(--gold);letter-spacing:2px}
.revtext{color:var(--cream);margin:4px 0;font-weight:600}
.revby{color:var(--muted);font-size:12px}
.rvstars{font-size:34px;letter-spacing:6px;text-align:center;margin:6px 0 4px;cursor:pointer;color:#3a3550}
.rvstars span{color:#3a3550;transition:color .1s}.rvstars span.on{color:var(--gold)}
.mediagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mcard{background:linear-gradient(180deg,#1c1e2b,#15161f);border:2px solid #2c2f42;border-radius:16px;padding:10px;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.mmedia{width:100%;border-radius:12px;background:#000;max-height:360px;object-fit:cover;display:block}
.mcap{color:var(--cream);font-weight:700;margin:8px 2px 2px}
.mmeta{color:var(--muted);font-size:11px;margin:2px}
.mcomments{margin-top:8px;display:grid;gap:5px}
.cmt{background:#11131c;border:1px solid #2c2f42;border-radius:9px;padding:6px 9px;font-size:13px;color:var(--cream)}
.cmt b{color:var(--gold)}
.cmtdel{background:transparent;border:none;box-shadow:none;color:var(--red);font-weight:900;font-size:13px;padding:0 4px;cursor:pointer;float:right}
input,select,textarea{font-family:inherit;font-weight:700;background:#0b0c11;color:var(--cream);
  border:2px solid #2a2e40;border-radius:10px;padding:10px 11px;font-size:15px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
label.fld{display:block;margin:9px 0}
label.fld span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
a{color:var(--gold)}
.app{max-width:1100px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;transition:margin-left .22s ease}
header.top{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg2);
  border-bottom:4px solid #000;position:sticky;top:0;z-index:30}
header.top img{height:46px;width:46px;object-fit:contain;border-radius:10px;background:#fff;padding:2px;border:2px solid var(--gold)}
header.top .ttl{font-size:20px;font-weight:900;letter-spacing:.5px}
header.top .ttl b{color:var(--gold)}
header.top .who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
header.top .who select{width:auto}
/* left menu — slides in and stays locked open until the collapse arrow is tapped */
nav.tabs{position:fixed;top:0;left:0;height:100%;width:250px;display:flex;flex-direction:column;gap:8px;
  padding:12px 12px 24px;background:var(--bg2);border-right:4px solid #000;box-shadow:var(--shadow);
  transform:translateX(-100%);transition:transform .22s ease;z-index:40;overflow-y:auto}
nav.tabs.open{transform:translateX(0)}
nav.tabs button{width:100%;text-align:left;white-space:nowrap;background:transparent;box-shadow:none;
  border-color:#2c3043;font-size:15px;padding:12px 14px}
nav.tabs button.active{background:var(--gold);color:#1a1300;border-color:#000}

/* ============================================================
   ✨ Glass theme — frosted, futuristic surfaces (override layer)
   ============================================================ */
:root{ --glass:rgba(26,29,44,.55); --glass-2:rgba(32,36,54,.62); --glassline:rgba(255,255,255,.10); --gold-glow:rgba(244,180,0,.30); --blue-glow:rgba(33,96,176,.28); }
body{ background:#0a0b11; position:relative; }
/* animated ambient glow behind everything */
body::before{ content:""; position:fixed; inset:-20% -20% -20% -20%; z-index:-2; pointer-events:none;
  background:
    radial-gradient(40% 35% at 18% 12%, var(--gold-glow), transparent 60%),
    radial-gradient(45% 40% at 85% 18%, var(--blue-glow), transparent 60%),
    radial-gradient(50% 45% at 50% 100%, rgba(122,77,187,.22), transparent 60%);
  filter:blur(30px); animation:glassdrift 22s ease-in-out infinite alternate; }
@keyframes glassdrift{ 0%{transform:translate3d(0,0,0) scale(1)} 100%{transform:translate3d(0,-3%,0) scale(1.08)} }
body{ background-image:linear-gradient(180deg,#0a0b11,#0c0e16 55%,#090a10); }
.wall{ background:transparent!important; }

/* frosted glass for all the main surfaces */
.card,.pagecard,.mktcard,.ordcard,.qrtile,.showcard,.installbanner,.notifrow{
  background:var(--glass)!important;
  -webkit-backdrop-filter:blur(16px) saturate(150%); backdrop-filter:blur(16px) saturate(150%);
  border:1px solid var(--glassline)!important;
  box-shadow:0 14px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07)!important;
}
.card{ border-radius:18px!important; }
.mktcard,.ordcard,.qrtile,.showcard,.notifrow{ border-radius:16px!important; }
.notifrow.unread{ border-color:var(--gold-glow)!important; box-shadow:0 0 0 1px var(--gold-glow), 0 14px 40px rgba(0,0,0,.45)!important; }
.mktcard:active{ transform:translateY(1px) scale(.997); }

/* page header: translucent frosted bar */
.pagehead{ background:rgba(14,16,24,.6)!important; -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
  border-bottom:1px solid var(--glassline)!important; padding-left:2px; padding-right:2px; }
.pagecard{ background:transparent!important; backdrop-filter:none; box-shadow:none!important; border:none!important; }

/* full-screen page overlays get a blurred backdrop */
.scanmodal{ background:rgba(8,9,15,.6)!important; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.scanmodal.pagewrap{ background:rgba(8,9,15,.72)!important; }

/* buttons — glassy with a soft sheen */
button{ border:1px solid var(--glassline); border-radius:13px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02)); color:var(--cream);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08); transition:transform .08s, box-shadow .15s, filter .15s; }
button:active{ transform:translateY(1px) scale(.99); }
button.gold{ background:linear-gradient(180deg,#FFD64A,#F1A800); color:#1a1300; border-color:rgba(255,215,74,.5);
  box-shadow:0 8px 22px rgba(244,180,0,.30), inset 0 1px 0 rgba(255,255,255,.4); }
button.blue{ background:linear-gradient(180deg,#2f7fe0,#1a55a8); color:#fff; border-color:rgba(47,127,224,.5);
  box-shadow:0 8px 22px rgba(33,96,176,.34), inset 0 1px 0 rgba(255,255,255,.18); }
button.red{ background:linear-gradient(180deg,#ef4a3d,#c5271c); color:#fff; border-color:rgba(239,74,61,.5); }
button.ghost{ background:rgba(255,255,255,.04); border-color:var(--glassline); box-shadow:none; }
.pageclose{ background:linear-gradient(180deg,#ef4a3d,#c5271c)!important; border:1px solid rgba(239,74,61,.5)!important; }
.wall-cta{ border:1px solid rgba(255,215,74,.5); box-shadow:0 12px 34px rgba(244,180,0,.38), inset 0 1px 0 rgba(255,255,255,.45); }

/* tabs / chips — glass pills with a glowing active state */
.walltab{ background:rgba(255,255,255,.05); border:1px solid var(--glassline); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.walltab.on{ background:linear-gradient(180deg,#FFD64A,#F1A800); color:#1a1300; border-color:rgba(255,215,74,.6); box-shadow:0 6px 18px rgba(244,180,0,.35); }
.mktsub,.subtabs button{ background:rgba(255,255,255,.04); border:1px solid var(--glassline); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.mktsub.on{ background:linear-gradient(180deg,#2f7fe0,#1a55a8); color:#fff; border-color:rgba(47,127,224,.55); }

/* inputs — subtle frosted fields */
.fld input,.fld textarea,.fld select,.mktsearch,.mktsort,input,textarea,select{
  background:rgba(10,12,20,.55)!important; border:1px solid var(--glassline)!important; color:var(--cream);
  border-radius:11px; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
.fld input:focus,.fld textarea:focus,.fld select:focus,.mktsearch:focus{ outline:none; border-color:var(--gold-glow)!important; box-shadow:0 0 0 3px rgba(244,180,0,.14)!important; }

/* the dark inset money/summary boxes → glass */
.cktot,.cktotal{ }
.ordstatus{ -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
.toast{ background:rgba(12,14,22,.82)!important; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border:1px solid var(--gold-glow)!important; }
.wall-logo{ box-shadow:0 0 0 6px rgba(244,180,0,.14),0 16px 50px rgba(0,0,0,.6),0 0 60px var(--gold-glow); }
@media (prefers-reduced-motion: reduce){ body::before{ animation:none; } }
/* ============================================================
   🎯 Design system v2 — senior redesign (typography, icons, rhythm)
   The app used weight 600–900 on nearly everything, which reads as
   shouty/janky. Here we set a real hierarchy: calm body text, weight
   reserved for headings + prices, a consistent inline-SVG icon system,
   a slim install strip, one clean tab rail, and refined auth screens.
   ============================================================ */
:root{
  --ink:#eef1f8;        /* primary text — softer than pure cream */
  --ink-2:#c3c8db;      /* secondary text */
  --ink-3:#8b91a8;      /* muted / captions */
  --s1:6px; --s2:10px; --s3:14px; --s4:20px; --s5:28px;
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px;
}
*{ -webkit-tap-highlight-color:transparent; }
body{ color:var(--ink); font-weight:450; font-size:15.5px; line-height:1.5; letter-spacing:.1px;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,Roboto,Arial,sans-serif;
  text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased; }
.muted,.mememail,.memdate,.mmeta,.revby,.wall-cta-sub,.qrsub{ color:var(--ink-3)!important; font-weight:450; }

/* ---- inline SVG icon system ---- */
svg.i{ width:1.05em; height:1.05em; vertical-align:-.16em; flex:0 0 auto; stroke:currentColor; }
.walltab svg.i{ width:16px; height:16px; }
.custbtn svg.i,.wall-stats svg.i{ width:15px; height:15px; }
.wall-cta svg.i{ width:20px; height:20px; vertical-align:-.22em; }

/* ---- the redundant top brand bar is hidden on the public wall ---- */
body:not(.authed) header.top{ display:none; }

/* ---- hero: calmer, single brand moment ---- */
.wall{ padding:22px 16px 96px; }
.wall-hero{ margin-bottom:18px; }
.wall-logo{ width:104px; height:104px; margin-bottom:12px; }
.wall-title{ font-size:clamp(27px,7.4vw,38px); letter-spacing:.5px; font-weight:800; }
.wall-title b{ font-weight:900; }
.wall-tag{ opacity:.7; font-weight:600; font-size:12px; letter-spacing:2px; margin-top:8px; }
.wall-cta{ margin-top:18px; border-radius:var(--r-lg); font-size:17px; padding:15px 24px;
  display:inline-flex; align-items:center; justify-content:center; gap:9px; }
.wall-cta-sub{ margin-top:8px; }
.wall-stats{ margin-top:15px; gap:8px; font-weight:500; color:var(--ink-2); }
.wall-stats span{ display:inline-flex; align-items:center; gap:6px; }
.wall-stats b{ font-size:16px; }

/* ---- section labels: refined small-caps ---- */
.wall-sec{ font-size:11.5px; letter-spacing:2.6px; margin:28px 0 14px; color:var(--ink-3); }
.wall-sec:before,.wall-sec:after{ background:linear-gradient(90deg,transparent,rgba(255,255,255,.14)); }
.wall-sec:after{ background:linear-gradient(270deg,transparent,rgba(255,255,255,.14)); }

/* ---- tabs: one clean horizontal rail with edge fade ---- */
.walltabs{ flex-wrap:nowrap!important; overflow-x:auto; justify-content:flex-start; gap:7px;
  padding:2px 2px 14px; margin:0 -4px 6px; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);
          mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent); }
.walltabs::-webkit-scrollbar{ display:none; }
.walltab{ display:inline-flex; align-items:center; gap:6px; padding:9px 14px; font-size:13px;
  font-weight:600; border-radius:999px; flex:0 0 auto; color:var(--ink-2); }
.walltab.on{ font-weight:800; }

/* ---- slim, elegant install / notify strip (was a giant box) ---- */
.installbanner{ display:flex; align-items:center; gap:11px; padding:11px 13px; margin:0 0 14px;
  border-radius:var(--r-md); border:1px solid var(--glassline); background:var(--glass);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); box-shadow:0 8px 22px rgba(0,0,0,.32); }
.installbanner .ibicon{ width:34px; height:34px; border-radius:10px; flex:0 0 auto; display:flex;
  align-items:center; justify-content:center; background:rgba(244,180,0,.14); color:var(--gold); }
.installbanner .ibicon svg.i{ width:19px; height:19px; }
.installbanner .ibmain{ flex:1; min-width:0; }
.installbanner .ibtitle{ font-weight:700; color:var(--ink); font-size:13.5px; }
.installbanner .ibmsg{ color:var(--ink-3); font-size:12px; margin-top:1px; font-weight:450; line-height:1.35; }
.installbanner .ibx{ position:static; align-self:flex-start; color:var(--ink-3); font-size:15px; }
.installbanner button.sm{ flex:0 0 auto; }

/* ---- customer / account utility bar ---- */
.custbar{ -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); margin-bottom:14px; }
.custhi{ font-weight:600; color:var(--ink-2); font-size:13px; }
.custbtn{ display:inline-flex; align-items:center; gap:6px; padding:8px 13px; font-weight:600;
  color:var(--ink); background:rgba(255,255,255,.05); border:1px solid var(--glassline); }
.custbtn.gold{ font-weight:800; }

/* ---- headings & body rhythm ---- */
h2.page{ font-weight:800; letter-spacing:.2px; }
h2.page small{ font-weight:450; }
.card{ padding:16px; }
.card h3{ font-size:15.5px; letter-spacing:.2px; font-weight:800; }
.card h3,.pagehead h3{ letter-spacing:.2px; }
.pagehead h3{ font-weight:800; }

/* ---- forms: quiet labels, roomy inputs ---- */
.fld{ margin-bottom:11px; }
label.fld span,.fld span{ display:block; font-size:11.5px; font-weight:700; letter-spacing:.5px;

/* ============================================================
   🔮 Holo Premium v3 — distinctive palette + bottom nav + sheet
   Shifts the app off flat gold-on-black: deep violet-black base,
   an iridescent violet→cyan interactive accent (the "holo" signature
   of trading cards), gradient hairline card edges, a real thumb-zone
   bottom tab bar (no more slider), and a More bottom-sheet.
   ============================================================ */
:root{
  --accent1:#c084fc; --accent2:#38bdf8; --accent3:#5eead4;
  --acc-grad:linear-gradient(120deg,#d8b4fe,#a78bfa 28%,#38bdf8 72%,#5eead4);
  --ink:#eff1f9; --ink-2:#c7ccdf; --ink-3:#949bb6;
  --glass:rgba(31,29,54,.55); --glass-2:rgba(38,35,64,.6); --glassline:rgba(255,255,255,.12);
}
body{ background:#0a0916!important; background-image:linear-gradient(180deg,#0b0a18,#0d0b1e 52%,#08070f)!important; }
body::before{
  background:
    radial-gradient(46% 40% at 10% 4%, rgba(168,132,255,.44), transparent 60%),
    radial-gradient(46% 42% at 92% 8%, rgba(56,189,248,.30), transparent 60%),
    radial-gradient(62% 52% at 50% 112%, rgba(236,72,153,.20), transparent 62%),
    radial-gradient(40% 34% at 78% 96%, rgba(94,234,212,.14), transparent 60%) !important;
  filter:blur(36px)!important;
}
/* richer frosted surfaces so content reads well on the deeper base */
.card,.pagecard,.mktcard,.ordcard,.qrtile,.showcard,.installbanner,.notifrow{ background:var(--glass)!important; }
.pagecard{ background:transparent!important; }

/* iridescent focus + subtle accent touches */
input:focus,textarea:focus,select:focus,.fld input:focus,.fld textarea:focus,.fld select:focus,.mktsearch:focus{
  border-color:rgba(34,211,238,.6)!important; box-shadow:0 0 0 3px rgba(34,211,238,.15)!important; }
.wall-logo{ box-shadow:0 0 0 5px rgba(244,180,0,.12),0 16px 46px rgba(0,0,0,.62),0 0 64px rgba(139,92,246,.4)!important; }
.membadge.acct,.vbadge{ background:var(--acc-grad); color:#0a0913; }

/* gradient hairline edges on surfaces — premium, and clearly not flat */
.card:not(.pagecard),.mktcard,.qrtile,.showcard,.ordcard,.notifrow,.installbanner{ position:relative; }
.card:not(.pagecard)::after,.mktcard::after,.qrtile::after,.showcard::after,.ordcard::after,.installbanner::after{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:1px;
  background:linear-gradient(135deg, rgba(192,132,252,.55), rgba(56,189,248,.26) 45%, rgba(255,255,255,0) 72%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; }

/* ---- slim top utility strip ---- */
.wtop{ display:flex; justify-content:flex-end; align-items:center; gap:10px; padding:4px 2px 8px; }
.wtop-btn{ padding:8px 16px; font-size:13px; font-weight:800; border-radius:999px; }
.wtop-ic{ position:relative; width:40px; height:40px; padding:0; display:flex; align-items:center; justify-content:center;
  border-radius:12px; background:rgba(255,255,255,.05); border:1px solid var(--glassline); box-shadow:none; }
.wtop-ic svg.i{ width:19px; height:19px; }
.wtop-badge{ position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; padding:0 4px; border-radius:999px;
  background:var(--red); color:#fff; font-size:10px; font-weight:900; display:flex; align-items:center; justify-content:center; }
.wtop-dot{ position:absolute; top:6px; right:7px; width:8px; height:8px; border-radius:50%; background:var(--red); }
.wtop{ justify-content:flex-start; }
.wtop-btn.gold{ display:inline-flex; align-items:center; gap:6px; background:linear-gradient(180deg,#FFD64A,#F1A800); color:#1a1300; border-color:rgba(255,215,74,.5); }

/* ---- Show Stats (staff show-day ledger) ---- */
.ss-kpi{ flex:1; min-width:88px; text-align:center; background:rgba(255,255,255,.05); border:1px solid var(--glassline); border-radius:12px; padding:8px 6px; }
.ss-kpi span{ display:block; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-3); font-weight:700; }
.ss-kpi b{ font-size:17px; color:var(--gold); }
.ss-lbl{ font-size:11.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-3); margin:4px 0 6px; }
.ss-chips{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; }
.ss-chip{ padding:10px 14px; font-size:13.5px; font-weight:700; border-radius:12px; background:rgba(255,255,255,.05);
  border:1px solid var(--glassline); color:var(--ink-2); box-shadow:none; }
.ss-chip.on{ background:linear-gradient(135deg,#c084fc,#38bdf8); color:#0a0913; border-color:transparent; box-shadow:0 6px 18px rgba(56,189,248,.4); }
.ss-chip.ss-add.on{ background:linear-gradient(180deg,#3ddc78,#1f9d52); color:#04160a; }
.ss-chip.ss-sub.on{ background:linear-gradient(180deg,#ef4a3d,#c5271c); color:#fff; }
.ss-lineblk{ border:1px solid var(--glassline); background:rgba(255,255,255,.03); border-radius:14px; padding:10px 10px 4px; margin:0 0 10px; }
.ss-lineblk .ss-chips{ margin-bottom:8px; }
.ssl-amt,.ssl-tval{ width:100%; box-sizing:border-box; margin:0 0 8px; }
.ss-tallygrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ss-tallybox{ background:var(--glass); border:1px solid var(--glassline); border-radius:16px; padding:12px 10px; min-height:112px;
  text-align:center; cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
.ss-tallybox:active{ transform:scale(.985); background:var(--glass-2); }
.ss-tname{ font-weight:800; font-size:13px; margin-bottom:6px; }
.ss-tmarks{ min-height:32px; display:flex; flex-wrap:wrap; gap:4px; justify-content:center; align-items:center; color:#F4B400; }
.ss-tval{ margin-top:6px; font-weight:800; color:var(--ink-2); font-size:12.5px; }
.ss-payline{ display:flex; align-items:center; gap:8px; padding:7px 0; font-size:14.5px; }
.ss-gal{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; }
.ss-gal img{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px; border:1px solid var(--glassline); cursor:pointer; background:#000; }

/* ---- fullscreen photo viewer ---- */
.pv-wrap{ position:fixed; inset:0; z-index:400; background:rgba(4,4,8,.94); display:flex; align-items:center; justify-content:center; }
.pv-img{ max-width:94vw; max-height:88vh; object-fit:contain; border-radius:10px; }
.pv-x{ position:absolute; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:2; width:44px; height:44px; border-radius:50%;
  background:var(--red); color:#fff; font-size:20px; font-weight:900; border:none; box-shadow:0 6px 18px rgba(0,0,0,.5); }
.pv-arrow{ position:absolute; top:50%; transform:translateY(-50%); z-index:2; width:46px; height:64px; font-size:34px; font-weight:900;
  background:rgba(255,255,255,.08); color:#fff; border:1px solid var(--glassline); border-radius:14px; display:flex; align-items:center; justify-content:center; padding-bottom:6px; }
.pv-prev{ left:8px; } .pv-next{ right:8px; }
.pv-count{ position:absolute; bottom:calc(14px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  color:var(--ink-2); font-weight:700; font-size:13px; background:rgba(0,0,0,.5); padding:4px 12px; border-radius:999px; }

/* ---- fixed bottom tab bar (thumb reachable) — replaces the slider ---- */
.wall{ padding-bottom:118px!important; }
.wnav{ position:fixed; left:50%; bottom:0; transform:translateX(-50%); width:100%; max-width:560px; z-index:60;
  display:flex; gap:2px; padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:rgba(11,10,19,.72); -webkit-backdrop-filter:blur(22px) saturate(160%); backdrop-filter:blur(22px) saturate(160%);
  border-top:1px solid var(--glassline); box-shadow:0 -12px 34px rgba(0,0,0,.55); }
.wnav-item{ flex:1; background:none; border:none; box-shadow:none; padding:4px 2px; border-radius:14px;
  display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--ink-3); font-weight:700; font-size:10.5px; letter-spacing:.2px; }
.wnav-ic{ position:relative; width:44px; height:30px; display:flex; align-items:center; justify-content:center;
  border-radius:12px; transition:background .2s, box-shadow .2s; }
.wnav-item svg.i{ width:22px; height:22px; }
.wnav-item.on{ color:#fff; }
.wnav-item.on .wnav-ic{ background:linear-gradient(135deg,#c084fc,#38bdf8); box-shadow:0 6px 20px rgba(56,189,248,.5); }
.wnav-item.on svg.i{ stroke:#0a0913; }
.wnav-item:active{ transform:translateY(1px); }
.wnav-badge{ position:absolute; top:-3px; right:2px; min-width:16px; height:16px; padding:0 4px; border-radius:999px;
  background:var(--red); color:#fff; font-size:9px; font-weight:900; display:flex; align-items:center; justify-content:center; }

/* ---- More bottom-sheet ---- */
.wsheet-wrap{ position:fixed; inset:0; z-index:210; }
.wsheet-back{ position:absolute; inset:0; background:rgba(6,6,12,.55); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); opacity:0; transition:opacity .2s; }
.wsheet-wrap.show .wsheet-back{ opacity:1; }
.wsheet{ position:absolute; left:0; right:0; bottom:0; max-width:560px; margin:0 auto;
  padding:10px 16px calc(20px + env(safe-area-inset-bottom));
  background:rgba(16,15,26,.92); -webkit-backdrop-filter:blur(26px); backdrop-filter:blur(26px);
  border-top-left-radius:24px; border-top-right-radius:24px; border:1px solid var(--glassline); border-bottom:none;
  transform:translateY(101%); transition:transform .28s cubic-bezier(.2,.85,.25,1); box-shadow:0 -22px 54px rgba(0,0,0,.55); }
.wsheet-wrap.show .wsheet{ transform:translateY(0); }
.wsheet-grip{ width:40px; height:4px; border-radius:2px; background:rgba(255,255,255,.2); margin:2px auto 12px; }
.wsheet-h{ font-weight:800; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-3); margin-bottom:12px; text-align:center; }
.wsheet-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.wsheet-item{ display:flex; flex-direction:column; align-items:center; gap:9px; padding:17px 6px; border-radius:16px;
  background:rgba(255,255,255,.045); border:1px solid var(--glassline); color:var(--ink); font-weight:600; font-size:11.5px; line-height:1.2; text-align:center; }
.wsheet-item svg.i{ width:24px; height:24px; color:var(--accent1); }
.wsheet-item:active{ transform:translateY(1px); background:rgba(255,255,255,.08); }
</style>

<script>
/* on-screen crash catcher — surfaces JS errors instead of a blank/crashing page */
(function(){function box(){var d=document.getElementById('crashlog');if(!d){d=document.createElement('div');d.id='crashlog';d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#3a0d0d;color:#fff;font:12px/1.4 monospace;padding:10px;white-space:pre-wrap;max-height:55vh;overflow:auto;border-top:2px solid #f44';document.body&&document.body.appendChild(d);}return d;}
window.addEventListener('error',function(e){var msg=(e.message||e.error||'')+'';
  /* ignore browser-masked cross-origin "Script error." (e.g. from CDN scripts) — it's noise, not a real app crash */
  if(/^script error\.?$/i.test(msg.trim())) return;
  var d=box();if(d)d.textContent+='ERR: '+msg+'  ['+(e.filename||'').split('/').pop()+':'+(e.lineno||'')+']\n';});
window.addEventListener('unhandledrejection',function(e){var d=box();if(d)d.textContent+='ASYNC: '+((e.reason&&(e.reason.message||e.reason))||'')+'\n';});})();
</script>
