# Builds the Play Store app bundle (unsigned) on GitHub's runners, which have the
# Android SDK preinstalled. The signed upload is produced outside CI so the signing
# key never touches this public repository.
name: build-aab
on:
  workflow_dispatch:
  push:
    branches: [claude/staff-sql-lj2yuc]
    paths: ['twa/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build bundle
        working-directory: twa
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
      - name: Commit unsigned bundle back
        run: |
          mkdir -p twa-out
          cp twa/app/build/outputs/bundle/release/app-release.aab twa-out/app-release-unsigned.aab
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add twa-out/app-release-unsigned.aab
          git commit -m "CI: unsigned app bundle" || exit 0
          git push
